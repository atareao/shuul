version: 2

# `target-branch: develop` porque en este repo `main` es de release: cada push
# a ella pasa por release-prepare.yml, que publica versión, changelog, tag e
# imagen. Las actualizaciones de dependencias son trabajo de integración y van
# a `develop`, como cualquier otro cambio.
#
# GitHub sólo lee este fichero desde la rama por defecto, así que no surte
# efecto hasta que llegue a `main` con la próxima release. Hasta entonces
# Dependabot sigue como está.
updates:
  - package-ecosystem: cargo
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Parches y minors viajan juntos; un major va solo, para poder revisarlo
      # y revertirlo sin arrastrar los cambios seguros.
      rust-patch-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-patch-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
