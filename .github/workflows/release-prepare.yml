name: Prepare Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Version, changelog and tag
    # Only guard against re-triggering on our own automated commit.
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT }}

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Install vampus
        run: cargo install vampus --git https://github.com/atareao/vampus

      # A merge to `main` can arrive in three states. Comparing the version in
      # `.vampus.yml` with the tag that points at it tells them apart, which
      # keeps the job idempotent:
      #
      #   skip  -> `v$CURRENT` exists and HEAD *is* that tag. Nothing to release;
      #            this is what a manual re-run of an already finished release
      #            looks like. Without this case a re-run would bump the version
      #            again and publish a spurious release.
      #   bump  -> `v$CURRENT` exists but HEAD has newer commits (a normal
      #            release PR that only carries features): bump first.
      #   tag   -> `v$CURRENT` is not tagged yet (the release PR already bumped
      #            `.vampus.yml` by hand): only changelog + tag.
      - name: Decide what to do
        id: state
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          CURRENT=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$CURRENT" >/dev/null; then
            TAGGED_SHA=$(git rev-list -n1 "v$CURRENT")
            if [ "$TAGGED_SHA" = "$(git rev-parse HEAD)" ]; then
              echo "action=skip" >> "$GITHUB_OUTPUT"
              echo "v$CURRENT is already released and HEAD is exactly that tag: nothing to release."
            else
              echo "action=bump" >> "$GITHUB_OUTPUT"
              echo "v$CURRENT is released but HEAD has newer commits: bumping."
            fi
          else
            echo "action=tag" >> "$GITHUB_OUTPUT"
            echo "v$CURRENT is not tagged yet (bumped in the release PR): tagging only."
          fi

      - name: Determine bump type from commits
        if: steps.state.outputs.action == 'bump'
        id: bump
        run: |
          LAST_TAG="${{ steps.state.outputs.last_tag }}"
          BASE=${LAST_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}
          COMMITS=$(git log "$BASE"..HEAD --format="%s")
          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|!:"; then
            echo "type=--major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE "^✨ ?feat|^feat"; then
            echo "type=--minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=--patch" >> "$GITHUB_OUTPUT"
          fi

      # vampus matches its `replaces` patterns against the *current* version
      # literal, so every managed file must be in sync with
      # `.vampus.yml:current_version` beforehand. When they are not, it aborts
      # without writing anything, which is the safe behaviour.
      - name: Bump version with vampus
        if: steps.state.outputs.action == 'bump'
        run: |
          BEFORE=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          vampus upgrade ${{ steps.bump.outputs.type }}
          AFTER=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::error::vampus left the version at $BEFORE instead of bumping it."
            echo "vampus exits 0 when it aborts, so this step would otherwise pass silently."
            echo "Most likely cause: a file listed in .vampus.yml's 'replaces' is missing"
            echo "(e.g. a gitignored file that does not exist in a fresh CI checkout)."
            exit 1
          fi
          echo "Bumped $BEFORE -> $AFTER"

      # vampus bumps the version literals declared in .vampus.yml, but it knows
      # nothing about backend/Cargo.lock: the workspace member carries its own
      # version in a `[[package]]` entry. Leaving it behind fails `cargo
      # --locked` on the release tag and dirties the tree on every local build,
      # so resync it here and fail loudly if it did not take.
      - name: Sync Cargo.lock with the bumped version
        if: steps.state.outputs.action == 'bump'
        run: |
          read_locked() {
            sed -n '/^name = "backend"$/{n;s/^version = "\(.*\)"$/\1/p;}' backend/Cargo.lock
          }
          BEFORE=$(read_locked)
          cargo update --workspace --manifest-path backend/Cargo.toml
          AFTER=$(read_locked)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::error::Cargo.lock stayed at $BEFORE instead of syncing with the bump."
            exit 1
          fi
          echo "Cargo.lock synced: $BEFORE -> $AFTER"

      - name: Read release version
        if: steps.state.outputs.action != 'skip'
        id: version
        run: |
          V=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing v$V"

      - name: Generate changelog
        if: steps.state.outputs.action != 'skip'
        run: git-cliff -o CHANGELOG.md --tag "v${{ steps.version.outputs.value }}"

      - name: Commit, tag and push
        if: steps.state.outputs.action != 'skip'
        run: |
          V="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: release v${V}"
            git push origin main
          fi
          if git rev-parse -q --verify "refs/tags/v${V}" >/dev/null; then
            echo "Tag v${V} already exists, not creating it again."
          else
            git tag "v${V}"
            git push origin "v${V}"
          fi

      # The release PR's head branch is `develop`, so a `gh pr merge
      # --delete-branch` on it deletes `develop` from the remote. The release
      # itself still goes out (tag, image, GitHub Release) and this step is the
      # only thing that fails, with a bare "pathspec 'develop' did not match any
      # file(s)" that names nothing. Fail with the cause instead.
      - name: Sync develop with main
        run: |
          if ! git fetch origin develop; then
            echo "::error::cannot fetch origin/develop. Most likely the branch was deleted by 'gh pr merge --delete-branch' on the release PR; if not, read the fetch error above."
            exit 1
          fi
          git checkout -B develop origin/develop
          git merge origin/main --no-edit
          git push origin develop
