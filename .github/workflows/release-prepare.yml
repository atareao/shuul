name: Prepare Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Version, changelog and tag
    # Only guard against re-triggering on our own automated commit.
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT }}

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install vampus
        run: cargo install vampus --git https://github.com/atareao/vampus

      # The merge to `main` may arrive in either state:
      #   - version files already bumped in the release PR  -> only tag
      #   - version files still equal to the last tag       -> bump first
      # Comparing `.vampus.yml` with the last tag tells us which one it is,
      # which keeps this job idempotent either way.
      - name: Decide whether a bump is still needed
        id: state
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          CURRENT=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          if [ "v$CURRENT" = "$LAST_TAG" ]; then
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
            echo "Version files are still at the last tag ($LAST_TAG): bumping."
          else
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            echo "Version files are already at $CURRENT (last tag $LAST_TAG): tagging only."
          fi

      - name: Determine bump type from commits
        if: steps.state.outputs.needs_bump == 'true'
        id: bump
        run: |
          LAST_TAG="${{ steps.state.outputs.last_tag }}"
          BASE=${LAST_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}
          COMMITS=$(git log "$BASE"..HEAD --format="%s")
          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|!:"; then
            echo "type=--major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE "^✨ ?feat|^feat"; then
            echo "type=--minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=--patch" >> "$GITHUB_OUTPUT"
          fi

      # vampus matches its `replaces` patterns against the *current* version
      # literal, so every managed file must be in sync with
      # `.vampus.yml:current_version` beforehand. When they are not, it aborts
      # without writing anything, which is the safe behaviour.
      - name: Bump version with vampus
        if: steps.state.outputs.needs_bump == 'true'
        run: vampus upgrade ${{ steps.bump.outputs.type }}

      - name: Read release version
        id: version
        run: |
          V=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing v$V"

      - name: Generate changelog
        run: git-cliff -o CHANGELOG.md --tag "v${{ steps.version.outputs.value }}"

      - name: Commit, tag and push
        run: |
          V="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: release v${V}"
            git push origin main
          fi
          if git rev-parse -q --verify "refs/tags/v${V}" >/dev/null; then
            echo "Tag v${V} already exists, not creating it again."
          else
            git tag "v${V}"
            git push origin "v${V}"
          fi

      - name: Sync develop with main
        run: |
          git checkout develop
          git merge origin/main --no-edit
          git push origin develop
