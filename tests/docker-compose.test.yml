# PostgreSQL para tests de integración
# Uso:
#   podman compose -f tests/docker-compose.test.yml up -d
#   DATABASE_URL=postgres://test:test@localhost:5433/test_db cargo test --test integration
#   podman compose -f tests/docker-compose.test.yml down -v

version: "3.8"

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 2s
      timeout: 5s
      retries: 10
