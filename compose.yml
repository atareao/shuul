services:
  shuul:
    image: ghcr.io/atareao/shuul
    container_name: shuul
    restart: unless-stopped
    init: true
    environment:
      # --- App ---
      RUST_LOG: backend=debug,maxminddb=warn
      RUST_BACTRACE: full
      RUST_ENV: production
      PORT: 3000
      DATABASE_URL: sqlite:///app/db/shuul.db
      # ── Auth (OIDC / PocketID) ──
      SECRET: $SECRET
      OIDC_ISSUER_URL: $OIDC_ISSUER_URL
      OIDC_CLIENT_ID: $OIDC_CLIENT_ID
      OIDC_CLIENT_SECRET: $OIDC_CLIENT_SECRET
      OIDC_REDIRECT_URL: $OIDC_REDIRECT_URL
      # --- GeoIP (MaxMind) ---
      MAXMIND_DB_PATH: /app/geo/GeoLite2-City.mmdb
      # --- Jail pipeline: Traefik access logs from systemd-journal-gatewayd ---
      # See SELF-HOSTING.md section 2. The gatewayd socket is bind-mounted
      # read-only, so there is no TCP port, no firewall rule and no
      # host.docker.internal alias involved. SHUUL_JOURNALD_URL still works for
      # a remote gatewayd.
      SHUUL_JOURNALD_SOCKET: /run/systemd/journal/gatewayd.sock
      SHUUL_JOURNALD_CONTAINER: traefik
    volumes:
      - geo:/app/geo
      - db:/app/db
      # Mount the whole directory, not the socket file: a single-file bind stays
      # attached to a dead inode when systemd recreates the socket.
      - /run/systemd/journal:/run/systemd/journal:ro
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/api/v1/health/
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: true
      traefik.http.routers.shuul.rule: Host(`${FQDN}`)
      traefik.http.routers.shuul.entrypoints: https
      traefik.http.services.shuul.loadbalancer.server.port: 3000
volumes:
  geo:
    external: true
  db: {}
networks:
  proxy:
    external: true
x-dockge:
  urls:
    - https://${FQDN}
