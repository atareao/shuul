[package]
name = "backend"
version = "0.3.1"
edition = "2024"

[dependencies]
axum = { version = "0.8.7", features = ["macros", "json", "original-uri"] }
axum-extra = { version = "0.10.3", features = ["cookie"] }
chrono = { version = "0.4.42", features = ["serde"] }
cookie = "0.18.1"
dotenv = "0.15.0"
http = "1.3.1"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
maxminddb = "0.26.0"
openssl = { version = "0.10.75" }
rand = "0.8"
regex = "1.12.2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "1.0.61"
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["postgres", "macros", "chrono", "runtime-tokio"] }
tokio = { version = "1.48.0", features = ["full", "time"] }
tower-http = { version = "0.6.6", features = ["cors", "fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["tracing", "env-filter", "local-time"] }
urlencoding = "2.1.3"

[dev-dependencies]
uuid = { version = "1.10.0", features = ["v4"] }

# ---------- CLIPPY CONFIG ----------
[lints.clippy]
# Deny only the most critical lints.
all = { level = "warn", priority = 10 }
# Disallow redundant clones.
redundant_clone = { level = "deny", priority = 9 }
# Enable pedantic warnings (more strict).
pedantic = { level = "warn", priority = 3 }
# Enable nursery warnings (experimental).
nursery = { level = "warn", priority = 2 }
